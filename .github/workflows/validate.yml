name: Verifica Varga Remote

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi PowerShell e manifest
        shell: powershell
        run: |
          $errorsFound = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errorsFound += $errors | ForEach-Object { "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($errorsFound.Count -gt 0) { throw ($errorsFound -join "`n") }
          $manifest = Get-Content windows/version.json -Raw | ConvertFrom-Json
          [void][Version]$manifest.versionNumber
          foreach ($file in $manifest.files) {
            if (-not (Test-Path (Join-Path windows $file))) { throw "File richiesto mancante: $file" }
          }
          Get-Content windows/router-database.json -Raw | ConvertFrom-Json | Out-Null
