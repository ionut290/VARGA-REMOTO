services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: varga-remote-hbbs
    command: hbbs -r ${VARGA_REMOTE_HOST}:21117
    volumes:
      - ./data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: varga-remote-hbbr
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    restart: unless-stopped

